- id: US-00012
  title: Deploy infrastructure with init-deploy
  priority: 12
  description: "Run make init-deploy to create base infrastructure.\n\nSteps:\n1.\
    \ Run make init-plan to review\n2. Run make init-deploy to create:\n   - GCS state\
    \ bucket\n   - Service account\n   - Enable APIs\n3. Run make update-backend to\
    \ generate provider.tf\n\nPre-requisite: Upload secrets to Secret Manager\n- OAuth\
    \ credentials from ~/.credentials/google_credentials.json\n- Gemini API key from\
    \ ~/.credentials/google_claude_np_api_key\n"
  tests:
  - make init-deploy completes successfully
  - State bucket exists in GCS
  - Service account is created
  - APIs are enabled
  - make update-backend generates iac/provider.tf
  passes: false
- id: US-00013
  title: Deploy application with make deploy
  priority: 13
  description: "Deploy full application infrastructure.\n\nSteps:\n1. Build and push\
    \ Docker image\n2. Run make plan to review\n3. Run make deploy to create:\n  \
    \ - Artifact Registry\n   - Cloud Run service\n   - Secret Manager secrets\n4.\
    \ Verify deployment with health check\n"
  tests:
  - make deploy completes successfully
  - Cloud Run service is running
  - Health endpoint responds
  - MCP endpoint is accessible (with auth)
  passes: false

